name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/probe_nike.py | while IFS= read -r l; do echo "::notice::$l"; done
      - run: |
          cd probe-out && git init -q -b probe && git config user.name bot && git config user.email bot@x && git add -A && git commit -qm probe
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
