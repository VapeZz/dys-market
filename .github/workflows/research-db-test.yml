# DISPOSABLE TEST (orphan branch research-db-test-1119; never merged; no schedule).
# Nov 19 focused re-test (Keo approved Nov 19, 6:33 AM): duplicate-draft fix + out-of-order check in Actions.
# Reads the existing test drafts; may create ONE empty draft named research-db-test-1119-lookupcheck; uploads nothing else.
# The full Nov 18 scenario workflow is in this branch's history (commit 779de6d).
name: Research DB storage test (disposable)
on:
  push:
    branches: [research-db-test-1119]
permissions:
  contents: write
concurrency:
  group: research-db-test
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RES: ${{ runner.temp }}/focused-results.json
    steps:
      - name: Refuse to run anywhere but the test branch
        run: test "$GITHUB_REF_NAME" = "research-db-test-1119"
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Tools
        run: which 7z || sudo apt-get install -y p7zip-full
      - name: Draft lookup — duplicates, create once, separate processes
        run: python -I research/tests/focused.py lookup-create "$RUNNER_TEMP/w" "$RUNNER_TEMP/focused-results.json"
      - name: Draft addressed by id in a later step
        run: python -I research/tests/focused.py lookup-verify "$RUNNER_TEMP/w" "$RUNNER_TEMP/focused-results.json"
      - name: Out-of-order and skipped days (restored Nov 15 snapshot)
        run: python -I research/tests/focused.py ordering "$RUNNER_TEMP/w" "$RUNNER_TEMP/focused-results.json"
      - name: Summary
        if: always()
        run: |
          python -I research/leakscan.py "$RUNNER_TEMP/focused-results.json"
          python -I - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          r = json.load(open(os.environ['RUNNER_TEMP'] + '/focused-results.json'))
          bad = [k for k, v in r.items() if not v['pass']]
          print(f"{len(r)-len(bad)}/{len(r)} passed" + (f" — failed: {', '.join(bad)}" if bad else ''))
          for k, v in r.items(): print(f"- {'PASS' if v['pass'] else 'FAIL'} {k}: {v['detail']}")
          open(os.environ['RUNNER_TEMP'] + '/bad', 'w').write(str(len(bad)) if len(r) == 11 else '99')
          PY
          test "$(cat "$RUNNER_TEMP/bad")" = "0"
