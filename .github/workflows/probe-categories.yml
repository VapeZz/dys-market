name: Probe TCGplayer categories
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://tcgcsv.com/tcgplayer/categories | python3 -c "
          import json,sys
          for c in json.load(sys.stdin)['results']:
              n=(c.get('name','')+' '+(c.get('displayName') or '')).lower()
              if c['categoryId'] >= 82 or 'gund' in n or 'mobile suit' in n:
                  print('::notice title=cat::'+str(c['categoryId'])+' | '+c['name']+' | '+str(c.get('displayName')))
          "
