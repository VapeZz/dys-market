name: eBay prices refresh

# Live eBay Buy It Now prices (raw + PSA 10) for cards, in batches every 6 hours (eBay Browse API,
# ~5,000 calls/day), each card refreshed about every 5 days; updates just data/ebay.json on the site.
on:
  schedule:
    - cron: "50 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Refresh a batch of eBay prices
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_CLIENT_SECRET_OLD: ${{ secrets.EBAY_CLIENT_SECRET_OLD }}
          EBAY_PER_RUN: "450"
        run: |
          set -e
          R="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git clone -q --depth 1 --branch data "$R" /tmp/db
          git clone -q --depth 1 --branch gh-pages "$R" /tmp/pages
          python tools/ebay_prices.py /tmp/pages /tmp/db/data/ebay | tee /tmp/g.log
          for d in /tmp/db /tmp/pages; do
            git -C $d config user.name "dys-market-bot"; git -C $d config user.email "dys-market-bot@users.noreply.github.com"
          done
          git -C /tmp/db add data/ebay && (git -C /tmp/db diff --cached --quiet || (git -C /tmp/db commit -q -m "eBay prices $(date -u +%FT%H:%MZ)" && git -C /tmp/db push -q origin data))
          git -C /tmp/pages add data/ebay.json && (git -C /tmp/pages diff --cached --quiet || (git -C /tmp/pages commit -q -m "eBay prices $(date -u +%FT%H:%MZ)" && git -C /tmp/pages push -q origin gh-pages))
          echo "::notice title=eBay::$(tail -n 1 /tmp/g.log)"
