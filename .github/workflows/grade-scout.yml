name: Grade scout (eBay PSA 10 vs raw)
# Shortlists cheap raw cards whose PSA 10 copies list on eBay for 10x+ raw, for the "Grade it?" carousel
# (Monday to Saturday). Saves data/social-grade/shortlist.json on the data branch; the posting task then
# checks each shortlisted card's real eBay SOLD prices before anything is built or posted.
on:
  schedule:
    - cron: "20 8 * * 1-6"      # Mon-Sat, 12:20 am Pacific (GitHub usually runs it 8-12 h late; if the shortlist is not ready at 9:47 am the Grade it? task dispatches this workflow itself)
  workflow_dispatch:
    inputs:
      game:
        description: "auto (rotation) | pokemon | one-piece | lorcana | riftbound | ..."
        default: "auto"
      max:
        description: "cards to check (one eBay search each)"
        default: "300"
permissions:
  contents: write
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          GAME: ${{ inputs.game || 'auto' }}
          MAX: ${{ inputs.max || '300' }}
          TZ: America/Los_Angeles     # date the shortlist with the Pacific date: the posting task's "today" is Pacific, so an evening run (already tomorrow in UTC) still counts as today's list
        run: |
          set -e
          R="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git clone -q --depth 1 --branch gh-pages "$R" /tmp/pages
          git clone -q --depth 1 --branch data "$R" /tmp/db
          mkdir -p /tmp/db/data/social-grade
          # The Grade it? task dispatches this run itself when the schedule is late; skip the late scheduled run
          # so it doesn't overwrite today's shortlist or advance the game rotation twice.
          if [ "${{ github.event_name }}" = "schedule" ] && python3 -c "import json,sys,datetime; sys.exit(0 if json.load(open('/tmp/db/data/social-grade/shortlist.json')).get('date') == datetime.date.today().isoformat() else 1)" 2>/dev/null; then
            echo "::notice title=Grade scout::today's shortlist already exists (made by a run the Grade it? task started); skipping"; exit 0
          fi
          python tools/grade_scout.py /tmp/pages "$GAME" --max "$MAX" --out /tmp/db/data/social-grade/shortlist.json --history /tmp/db/data/social-grade/history.json
          git -C /tmp/db config user.name "dys-market-bot"; git -C /tmp/db config user.email "dys-market-bot@users.noreply.github.com"
          git -C /tmp/db add data/social-grade/shortlist.json $(ls /tmp/db/data/social-grade/rotation.json 2>/dev/null) && (git -C /tmp/db diff --cached --quiet || (git -C /tmp/db commit -q -m "Grade scout shortlist" && git -C /tmp/db push -q origin data))
