name: Price history backfill (TCG API)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test (free plan check) or full (Pro plan backfill)"
        type: choice
        options: [test, full]
        default: test

permissions:
  contents: write
  actions: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore saved prices (data branch)
        run: |
          git clone --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/data-branch
          rm -rf data && cp -r /tmp/data-branch/data ./data
      - name: Fetch history
        env:
          TCGAPI_KEY: ${{ secrets.TCGAPI_KEY }}
        run: python pipeline/tcgapi_backfill.py ${{ inputs.mode }}
      - name: Save prices (data branch)
        if: ${{ inputs.mode == 'full' && always() }}
        run: |
          rm -rf /tmp/data-out && mkdir -p /tmp/data-out && cp -r data /tmp/data-out/data
          cd /tmp/data-out && git init -q -b data
          git config user.name "dys-market-bot" && git config user.email "dys-market-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Price data + TCG API history $(date -u +%F)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
      - name: Rebuild site
        if: ${{ inputs.mode == 'full' && always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nightly.yml --ref main -f backfill=false
