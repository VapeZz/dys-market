name: Cards of the day preview (test branch only)
# Renders preview posts of the upgraded "Cards of the day" builder from the live site's data,
# with real card photos, and saves them to the cotd-v2-preview branch. Changes nothing live.
on:
  push:
    branches: [cotd-v2]
    paths: [tools/daily_card.py, .github/workflows/cotd-preview.yml]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q playwright==1.56.0 imageio-ffmpeg numpy pillow && python -m playwright install --with-deps chromium
      - name: Live site data (read only)
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/pages
          git -C /tmp/pages sparse-checkout set --no-cone /data/sets.json /data/meta.json /data/set/ /social/latest.json /social-daily/history.json /social-daily-other/history.json
      - name: Render previews
        run: |
          D="$(TZ=America/Los_Angeles date -d tomorrow +%F)"
          cd tools
          python daily_card.py /tmp/pages/data /tmp/prev/evening --sample --date "$D" --trending /tmp/pages/social/latest.json --history /tmp/pages/social-daily/history.json | grep -v '^make_short'
          python daily_card.py /tmp/pages/data /tmp/prev/midday --sample --rotate --date "$D" --history /tmp/pages/social-daily-other/history.json | grep -v '^make_short'
      - name: Save to cotd-v2-preview branch
        run: |
          cd /tmp/prev
          find . -name short.mp4 ! -path "*evening/samples/pokemon-jumps/*" -delete
          git init -q -b cotd-v2-preview && git config user.name "dys-market-bot" && git config user.email "dys-market-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Cards of the day preview" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" cotd-v2-preview
          for f in */samples/summary.json; do python -c "import json; [print(s['sample'], '|', s.get('first', 'skipped')) for s in json.load(open('$f'))]"; done > /tmp/sum.txt
          echo "::notice title=Preview::$(tr '\n' ' ' < /tmp/sum.txt)"
