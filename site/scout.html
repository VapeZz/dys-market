<body data-page="scout">
<header id="top"></header>
<main>

<div class="wrap"><section class="block sc">
  <div class="block-head"><div><span class="eyebrow"><b>●</b> Owner only · unlisted</span><h1 style="font-size:34px;margin-top:8px">Daily Scout</h1>
    <p class="muted" id="sc-sub"></p></div>
    <a class="chip" href="buyer.html">Buyer dashboard →</a></div>
  <p class="sc-note" id="sc-note" hidden></p>
  <div class="sc-bar">
    <div class="chips-row" id="sc-plan" role="group" aria-label="Plan"></div>
    <div class="chips-row" id="sc-game" role="group" aria-label="Game"></div>
    <div class="sc-ctl">
      <label>Type <select id="sc-type"><option value="">All</option><option value="c">Cards</option><option value="s">Sealed</option></select></label>
      <label>Budget <select id="sc-budget"><option value="">Any</option><option value="2500">Under $25</option><option value="5000">Under $50</option><option value="10000">Under $100</option><option value="25000">Under $250</option><option value="50000">Under $500</option><option value="100000">Under $1,000</option></select></label>
      <label class="sc-check"><input type="checkbox" id="sc-buys"> Buys only</label>
      <label class="sc-check"><input type="checkbox" id="sc-hide"> Hide reviewed</label>
    </div>
    <details class="sc-cfg" id="sc-cfg"><summary>Fees &amp; shipping</summary><div id="sc-cfg-body"></div></details>
  </div>
  <p class="sc-progress" id="sc-progress"></p>
  <div id="sc-list"><div class="skeleton" style="height:240px"></div></div>
