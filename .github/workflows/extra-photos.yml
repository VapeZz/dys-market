name: Extra card photos
# Photos for cards with no photo anywhere on TCGplayer, only from sources whose written terms allow it
# (tools/extra_photos.py). Results go to the card-photos branch; the nightly build copies them into the site.
on:
  schedule:
    - cron: "47 11 * * 6"   # Saturdays ~3:47 AM PT, after the photo audit
  workflow_dispatch:
    inputs:
      games:
        description: "yugioh or pokemon-jp"
        required: false
        default: "yugioh"
      dry:
        description: "1 = trial: match only, write a report to the photo-trial branch"
        required: false
        default: "0"
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          git fetch -q --depth 1 origin img-audit && git show FETCH_HEAD:img-audit.json > /tmp/img-audit.json
          mkdir -p /tmp/photos
          if git fetch -q --depth 1 origin card-photos; then git archive FETCH_HEAD | tar -x -C /tmp/photos; fi
          if [ "${{ inputs.dry }}" = "1" ]; then
            mkdir -p /tmp/trial && python3 tools/extra_photos.py audit=/tmp/img-audit.json out=/tmp/trial games=${{ inputs.games }} dry=1 | tee /tmp/trial/log.txt
            cd /tmp/trial && BR=photo-trial
          else
            python3 tools/extra_photos.py audit=/tmp/img-audit.json out=/tmp/photos games=${{ inputs.games || 'yugioh' }} | tee /tmp/photos/log.txt
            cd /tmp/photos && BR=card-photos
          fi
          git init -q -b $BR && git config user.name dys-market-bot && git config user.email dys-market-bot@users.noreply.github.com
          git add -A && git commit -qm "Extra card photos $(date -u +%F)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" $BR
