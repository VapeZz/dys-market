name: eBay population probe (one-off test)
# Read-only test on its own branch: does eBay's Browse API return PSA population for slab listings?
on:
  workflow_dispatch:
  push:
    branches: [ebay-pop-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python tools/ebay_pop_probe.py
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
