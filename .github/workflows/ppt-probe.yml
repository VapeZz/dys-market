name: PPT probe (one-off)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Look at one card's response shape
        env:
          PPT_API_KEY: ${{ secrets.PPT_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request("https://www.pokemonpricetracker.com/api/v2/cards?tcgPlayerId=534919&includeEbay=true&days=90",
                                       headers={"Authorization": "Bearer " + os.environ["PPT_API_KEY"].strip(), "User-Agent": "dys-market"})
          try:
              d = json.load(urllib.request.urlopen(req, timeout=60))
          except urllib.error.HTTPError as e:
              print(f"::error title=PPT::{e.code} {e.read()[:300]}"); raise SystemExit(1)
          def shape(o, depth=0):
              if isinstance(o, dict): return {k: shape(v, depth+1) for k, v in list(o.items())[:40]} if depth < 6 else "{...}"
              if isinstance(o, list): return [shape(o[0], depth+1), f"len={len(o)}"] if o else []
              return o
          s = json.dumps(shape(d), separators=(",", ":"))
          for i in range(0, min(len(s), 9000), 900):
              print(f"::notice title=PPT {i//900}::{s[i:i+900]}")
          PY
