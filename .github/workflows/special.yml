name: Special short (one-off)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -q playwright==1.56.0 imageio-ffmpeg
          python -m playwright install --with-deps chromium > /dev/null
          python tools/special_short.py tools/special/most-expensive.json out
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: special
          path: out
