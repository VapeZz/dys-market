name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          for p in lorcana/ZZQ lorcana/TFC lorcana/HYC lorcana/WDU riftbound/OGN riftbound/RAD palworld/BP01 palworld/BP02 palworld/ZZQ; do
            f=$(echo $p | tr / _).png
            code=$(curl -s -o $f -w "%{http_code} %{content_type} %{size_download}" -A Mozilla/5.0 "https://images.scrydex.com/$p-logo/logo")
            echo "::notice::$p $code $(md5sum $f | cut -c1-8)"
          done
          git init -q -b probe && git config user.name b && git config user.email b@x && git add -A && git commit -qm p
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
