name: Nightly market update

on:
  schedule:
    # TCGCSV publishes around 20:00 UTC; run after it (1:30pm PDT / 2:30pm PST).
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Download past prices (first run only, takes ~10-20 min)"
        type: boolean
        default: false
      merge_games:
        description: "Add past prices for newly added games (TCGplayer category ids, e.g. 71,89,91)"
        type: string
        default: ""
      merge_archive:
        description: "Add archived past prices for newly added games (archive slugs, e.g. gundam,union-arena)"
        type: string
        default: ""
      social:
        description: "Make this week's Trending cards carousel now (runs automatically on Sundays)"
        type: boolean
        default: false
      sneaker_social:
        description: "Make next week's Sneaker drops carousel now (runs automatically on Sundays)"
        type: boolean
        default: false
      daily_samples:
        description: "Render a sample Card of the Day for every game (preview only)"
        type: boolean
        default: false
      report:
        description: "Publish this week's Market Report blog post now (runs automatically on Sundays)"
        type: boolean
        default: false
      howto:
        description: "Make a How-to tool post now (runs automatically on Tuesdays and Fridays)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install encryption library (stored third-party data is kept encrypted)
        run: pip install -q cryptography

      - name: Restore saved prices (data branch)
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git clone --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/data-branch
            rm -rf data && cp -r /tmp/data-branch/data ./data
            echo "Restored $(ls data/snapshots | wc -l) snapshots"
          else
            echo "No saved data yet (first run)."
            mkdir -p data
          fi
          # keep any store overrides committed on main
          if [ -f store-overrides.json ]; then cp store-overrides.json data/store-overrides.json; fi

      - name: Backfill past prices
        if: ${{ inputs.backfill }}
        env:
          PPT_API_KEY: ${{ secrets.PPT_API_KEY }}
          PPT_API_KEY_OLD: ${{ secrets.PPT_API_KEY_OLD }}
        run: |
          which 7z || sudo apt-get install -y p7zip-full
          python pipeline/backfill.py

      - name: Backfill past prices for new games
        if: ${{ inputs.merge_games != '' }}
        env:
          MERGE_GAMES: ${{ inputs.merge_games }}
          PPT_API_KEY: ${{ secrets.PPT_API_KEY }}
          PPT_API_KEY_OLD: ${{ secrets.PPT_API_KEY_OLD }}
        run: |
          which 7z || sudo apt-get install -y p7zip-full
          python pipeline/backfill.py --merge "$MERGE_GAMES"

      - name: Past prices for new games from our price archive
        if: ${{ inputs.merge_archive != '' }}
        continue-on-error: true
        env:
          MERGE_ARCHIVE: ${{ inputs.merge_archive }}
          PPT_API_KEY: ${{ secrets.PPT_API_KEY }}
          PPT_API_KEY_OLD: ${{ secrets.PPT_API_KEY_OLD }}
        run: python pipeline/merge_archive.py "$MERGE_ARCHIVE"

      - name: Download today's prices and build site data
        env:
          PPT_API_KEY: ${{ secrets.PPT_API_KEY }}         # opens the encrypted older price history
          PPT_API_KEY_OLD: ${{ secrets.PPT_API_KEY_OLD }}
        run: python pipeline/run.py

      - name: Collectors page (public binders, likes, follows)
        continue-on-error: true
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          pip install -q cryptography > /dev/null 2>&1 || true
          python pipeline/showcase.py site 2>&1 | tee /tmp/col.log
          echo "::notice title=Collectors::$(tail -n 1 /tmp/col.log)"

      - name: Buyer dashboard (owner only)
        continue-on-error: true
        run: |
          python pipeline/buyer.py 2>&1 | tee /tmp/buyer.log
          echo "::notice title=Buyer::$(tail -n 1 /tmp/buyer.log)"

      - name: Daily Scout (owner's ranked buy list)
        continue-on-error: true
        run: |
          python pipeline/scout.py 2>&1 | tee /tmp/scout.log
          echo "::notice title=Scout::$(tail -n 1 /tmp/scout.log)"

      - name: Grading candidates
        continue-on-error: true
        run: |
          python tools/grading.py site 2>&1 | tee /tmp/grading.log
          echo "::notice title=Grading::$(tail -n 1 /tmp/grading.log)"

      - name: Graded sold prices (PokemonPriceTracker)
        continue-on-error: true
        env:
          PPT_API_KEY: ${{ secrets.PPT_API_KEY }}
          PPT_API_KEY_OLD: ${{ secrets.PPT_API_KEY_OLD }}
        run: |
          python tools/graded.py site data/graded 2>&1 | tee /tmp/graded.log
          echo "::notice title=Graded::$(tail -n 1 /tmp/graded.log)"

      - name: eBay Buy It Now prices (cache only; ebay.yml refreshes)
        continue-on-error: true
        env:
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}   # opens the encrypted cache; no client id, so no searches here
          EBAY_CLIENT_SECRET_OLD: ${{ secrets.EBAY_CLIENT_SECRET_OLD }}
        run: |
          python tools/ebay_prices.py site data/ebay 2>&1 | tee /tmp/ebay.log
          echo "::notice title=eBay::$(tail -n 1 /tmp/ebay.log)"

      - name: Market Intel (brief, indices, signals)
        continue-on-error: true
        run: |
          python tools/intel.py site 2>&1 | tee /tmp/intel.log
          echo "::notice title=Intel::$(tail -n 1 /tmp/intel.log)"

      - name: Price pages for search engines
        continue-on-error: true
        run: |
          python tools/price_pages.py site 2>&1 | tee /tmp/pp.log
          echo "::notice title=Price pages::$(tail -n 1 /tmp/pp.log)"

      - name: Sneaker release photos
        continue-on-error: true
        run: |
          python tools/sneaker_images.py | tee /tmp/snk.log
          echo "::notice title=Sneakers::$(tail -n 1 /tmp/snk.log)"

      - name: Weekly Trending cards carousel (Sundays)
        if: ${{ inputs.social || github.event.schedule == '30 21 * * *' }}
        continue-on-error: true
        run: |
          if [ "${{ inputs.social }}" != "true" ] && [ "$(date -u +%u)" != "7" ]; then echo "Not Sunday; skipping"; exit 0; fi
          set +e
          pip install -q playwright==1.56.0 imageio-ffmpeg numpy > /tmp/social.log 2>&1 || { echo "::error title=Carousel::pip install failed: $(tail -c 400 /tmp/social.log | tr '\n' ' ')"; exit 1; }
          python -m playwright install --with-deps chromium > /tmp/social.log 2>&1 || { echo "::error title=Carousel::browser install failed: $(tail -c 400 /tmp/social.log | tr '\n' ' ')"; exit 1; }
          python tools/social.py site/data data/social --date "$(date -u +%F)" > /tmp/social.log 2>&1; rc=$?
          cat /tmp/social.log
          if [ $rc -ne 0 ]; then echo "::error title=Carousel::$(tail -c 600 /tmp/social.log | tr '\n' ' ')"; exit 1; fi
          echo "::notice title=Carousel::$(tail -n 1 /tmp/social.log)"

      - name: Weekly Sneaker drops carousel (Sundays)
        if: ${{ inputs.sneaker_social || github.event.schedule == '30 21 * * *' }}
        continue-on-error: true
        run: |
          if [ "${{ inputs.sneaker_social }}" != "true" ] && [ "$(date -u +%u)" != "7" ]; then echo "Not Sunday; skipping"; exit 0; fi
          set +e
          python -c "import playwright" 2>/dev/null || { pip install -q playwright==1.56.0 && python -m playwright install --with-deps chromium; }; pip install -q imageio-ffmpeg numpy > /tmp/snks.log 2>&1
          python tools/sneaker_social.py site data/social-sneakers --date "$(date -u +%F)" > /tmp/snks.log 2>&1; rc=$?
          cat /tmp/snks.log
          if [ $rc -ne 0 ]; then echo "::error title=Sneaker carousel::$(tail -c 600 /tmp/snks.log | tr '\n' ' ')"; exit 1; fi
          echo "::notice title=Sneaker carousel::$(tail -n 1 /tmp/snks.log)"

      - name: Weekly In stock & under market carousel (Wednesdays)
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" != "3" ]; then echo "Not Wednesday; skipping"; exit 0; fi
          set +e
          python -c "import playwright" 2>/dev/null || { pip install -q playwright==1.56.0 && python -m playwright install --with-deps chromium; }; pip install -q imageio-ffmpeg numpy > /tmp/deals.log 2>&1
          python tools/deals_social.py site/data data/social-deals --date "$(date -u +%F)" > /tmp/deals.log 2>&1; rc=$?
          cat /tmp/deals.log
          if [ $rc -ne 0 ]; then echo "::error title=Deals carousel::$(tail -c 600 /tmp/deals.log | tr '\n' ' ')"; exit 1; fi
          echo "::notice title=Deals carousel::$(tail -n 1 /tmp/deals.log)"

      - name: How-to tool post (Tuesdays and Fridays)
        continue-on-error: true
        run: |
          if [ "${{ inputs.howto }}" != "true" ] && [ "$(date -u +%u)" != "2" ] && [ "$(date -u +%u)" != "5" ]; then echo "Not Tue/Fri; skipping"; exit 0; fi
          set +e
          python -c "import playwright" 2>/dev/null || { pip install -q playwright==1.56.0 && python -m playwright install --with-deps chromium; }; pip install -q imageio-ffmpeg numpy pillow > /tmp/howto.log 2>&1
          python tools/howto_social.py site data/social-howto --date "$(date -u +%F)" > /tmp/howto.log 2>&1; rc=$?
          cat /tmp/howto.log
          if [ $rc -ne 0 ]; then echo "::error title=How-to post::$(tail -c 600 /tmp/howto.log | tr '\n' ' ')"; exit 1; fi
          echo "::notice title=How-to post::$(tail -n 1 /tmp/howto.log)"

      - name: Card of the Day (TikTok, daily)
        continue-on-error: true
        run: |
          set +e
          python -c "import playwright" 2>/dev/null || { pip install -q playwright==1.56.0 && python -m playwright install --with-deps chromium; }; pip install -q imageio-ffmpeg numpy > /tmp/daily.log 2>&1
          python tools/daily_card.py site/data data/social-daily --date "$(date -u +%F)" > /tmp/daily.log 2>&1; rc=$?
          cat /tmp/daily.log
          if [ $rc -ne 0 ]; then echo "::error title=Card of the Day::$(tail -c 600 /tmp/daily.log | tr '\n' ' ')"; exit 1; fi
          echo "::notice title=Card of the Day::$(tail -n 1 /tmp/daily.log)"

      - name: Card of the Day, other TCGs (midday, rotates games)
        continue-on-error: true
        run: |
          set +e
          python tools/daily_card.py site/data data/social-daily-other --rotate --date "$(date -u +%F)" > /tmp/daily2.log 2>&1; rc=$?
          if [ "${{ inputs.daily_samples }}" = "true" ]; then python tools/daily_card.py site/data data/social-daily-other --sample --date "$(date -u +%F)" >> /tmp/daily2.log 2>&1; fi
          cat /tmp/daily2.log
          if [ $rc -ne 0 ]; then echo "::error title=Card of the Day (other)::$(tail -c 600 /tmp/daily2.log | tr '\n' ' ')"; exit 1; fi
          echo "::notice title=Card of the Day (other)::$(tr '\n' ' ' < /tmp/daily2.log | tail -c 900)"

      - name: Daily market brief Story (only on days the market moved)
        continue-on-error: true
        run: |
          python -c "import playwright" 2>/dev/null || { pip install -q playwright==1.56.0 && python -m playwright install --with-deps chromium; }
          python tools/intel_story.py site data/intel-daily 2>&1 | tee /tmp/istory.log
          echo "::notice title=Brief story::$(tail -n 1 /tmp/istory.log)"

      - name: Weekly market report (blog, Sundays)
        continue-on-error: true
        run: |
          set +e
          python tools/blog.py site data/blog --date "$(date -u +%F)" ${{ inputs.report && '--force' || '' }} > /tmp/blog.log 2>&1; rc=$?
          cat /tmp/blog.log
          if [ $rc -ne 0 ]; then echo "::error title=Market report::$(tail -c 600 /tmp/blog.log | tr '\n' ' ')"; exit 1; fi
          echo "::notice title=Market report::$(tr '\n' ' ' < /tmp/blog.log)"

      - name: Card scanner fingerprints (new cards only)
        continue-on-error: true
        run: |
          pip install -q numpy pillow > /dev/null 2>&1
          python tools/card_prints.py site data/prints 2>&1 | tee /tmp/prints.log
          echo "::notice title=Scanner::$(tail -n 1 /tmp/prints.log)"

      - name: Copy social images into the site
        run: |
          if [ -d data/blog ]; then mkdir -p site/blog && cp -r data/blog/. site/blog/; fi
          if [ -d data/social ]; then mkdir -p site/social && cp -r data/social/. site/social/; fi
          if [ -d data/social-sneakers ]; then mkdir -p site/social-sneakers && cp -r data/social-sneakers/. site/social-sneakers/; fi
          if [ -d data/social-daily ]; then mkdir -p site/social-daily && cp -r data/social-daily/. site/social-daily/; fi
          if [ -d data/social-daily-other ]; then mkdir -p site/social-daily-other && cp -r data/social-daily-other/. site/social-daily-other/; fi
          if [ -d data/intel-daily ]; then mkdir -p site/intel-daily && cp -r data/intel-daily/. site/intel-daily/; fi
          if [ -d data/social-deals ]; then mkdir -p site/social-deals && cp -r data/social-deals/. site/social-deals/; fi
          if [ -d data/social-howto ]; then mkdir -p site/social-howto && cp -r data/social-howto/. site/social-howto/; fi

      - name: Sync Shopify prices to market
        continue-on-error: true
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python pipeline/shopify_sync.py

      - name: Save prices (data branch)
        run: |
          rm -rf /tmp/data-out && mkdir -p /tmp/data-out
          cp -r data /tmp/data-out/data
          find /tmp/data-out/data -name '*.mp4' -delete   # videos only live on the site (gh-pages)
          cd /tmp/data-out
          git init -q -b data
          git config user.name "dys-market-bot"
          git config user.email "dys-market-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Price data $(date -u +%F)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - name: Publish site (gh-pages branch)
        run: |
          rm -rf /tmp/site-out && cp -r site /tmp/site-out && touch /tmp/site-out/.nojekyll
          # bust browser caches so visitors always get the latest script and styles
          sed -i "s#assets/app.js\"#assets/app.js?v=${{ github.run_id }}\"#; s#assets/app.css\"#assets/app.css?v=${{ github.run_id }}\"#; s#assets/edge.js\"#assets/edge.js?v=${{ github.run_id }}\"#; s#assets/edge.css\"#assets/edge.css?v=${{ github.run_id }}\"#" /tmp/site-out/*.html $(ls /tmp/site-out/blog/*.html 2>/dev/null)
          cd /tmp/site-out
          git init -q -b gh-pages
          git config user.name "dys-market-bot"
          git config user.email "dys-market-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Site $(date -u +%F)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
