name: Scan benchmark
on:
  workflow_dispatch:
    inputs:
      n:
        description: "Number of test photos"
        default: "50"
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run
        run: |
          pip install -q playwright==1.56.0 pillow
          python -m playwright install --with-deps chromium > /dev/null
          git clone -q --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/pages
          mkdir -p /tmp/v && cp /tmp/pages/assets/scan.js /tmp/v/live.js && cp site/assets/scan.js /tmp/v/new.js
          pip install -q numpy
          run() { "$@" > /tmp/log 2>&1; rc=$?; cat /tmp/log; if [ $rc -ne 0 ]; then echo "::error title=$2::$(tail -c 900 /tmp/log | tr '\n' ' ')"; exit 1; fi; echo "::notice title=$2::$(tail -n 1 /tmp/log)"; }
          run python tools/card_prints.py /tmp/pages /tmp/store
          run python tools/scan_bench.py /tmp/pages /tmp/v/live.js /tmp/v/new.js --n "${{ inputs.n }}" --out out --seed 7
          run python tools/scan_bench.py /tmp/pages /tmp/v/new.js --n "${{ inputs.n }}" --out out/hard --hard --seed 33
      - name: Save results (scan-bench branch)
        if: always()
        run: |
          cd out && git init -q -b scan-bench && git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -qm "Scan bench $(date -u +%FT%H:%MZ)" && git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" scan-bench
