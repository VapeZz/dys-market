name: Scan fingerprint experiment
on:
  workflow_dispatch:
    inputs:
      pool:
        default: "1500"
jobs:
  exp:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          pip install -q pillow numpy
          git clone -q --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/pages
          git clone -q --depth 1 --branch scan-bench "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/photos
          python tools/scan_hash_exp.py /tmp/pages /tmp/photos --pool "${{ inputs.pool }}"
