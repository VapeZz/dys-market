name: Special short (one-off)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -q playwright==1.56.0 imageio-ffmpeg
          python -m playwright install --with-deps chromium > /dev/null
          python tools/special_short.py tools/special/most-expensive.json out
          ls -la out
      - name: Publish to gh-pages
        run: |
          git clone --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/pages
          mkdir -p /tmp/pages/social-special/2026-10-17
          cp out/*.jpg out/short.mp4 /tmp/pages/social-special/2026-10-17/
          cd /tmp/pages
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-special && git commit -qm "Special short" && git push -q origin gh-pages
