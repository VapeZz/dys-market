name: Probe Shopify scopes
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          cd pipeline && python -c "
          import os, shopify_api as s
          c=s.Shopify(os.environ['SHOPIFY_SHOP'])
          d=c.gql('{ currentAppInstallation { accessScopes { handle } } }')
          print(','.join(x['handle'] for x in d['currentAppInstallation']['accessScopes']))
          " | while read -r l; do echo "::notice title=scopes::$l"; done
