name: Shop story slides
on: workflow_dispatch
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-24.04   # Playwright 1.56 has no Chromium for ubuntu-26.04 (ubuntu-latest)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: |
          set -e
          pip install -q playwright==1.56.0 && python -m playwright install --with-deps chromium > /dev/null
          git clone -q --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/pages
          python tools/shop_story.py /tmp/pages/data /tmp/pages/social-highlights --slides 3
          cd /tmp/pages && git config user.name bot && git config user.email bot@users.noreply.github.com && git add social-highlights && git commit -qm "Shop story slides" && git push -q origin gh-pages
