name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://tcgcsv.com/tcgplayer/categories | python3 -c "
          import json,sys,re
          for c in json.load(sys.stdin)['results']:
              n=(c.get('displayName') or c['name'])
              if re.search(r'lorcana|riftbound|pal', n, re.I): print(f\"::notice::{c['categoryId']} | {n} | {c['name']}\")"
          for c in $(curl -s https://tcgcsv.com/tcgplayer/categories | python3 -c "import json,sys,re;print(' '.join(str(c['categoryId']) for c in json.load(sys.stdin)['results'] if re.search(r'lorcana|riftbound|palworld',(c.get('displayName') or c['name']),re.I)))"); do
            curl -s https://tcgcsv.com/tcgplayer/$c/groups | python3 -c "import json,sys;g=json.load(sys.stdin)['results'];print(f'::notice::cat $c groups {len(g)}: '+'; '.join(x['name']+' '+(x.get('publishedOn') or '')[:10] for x in g[:12]))"
          done
